  <style>
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes scanline {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(450px); opacity: 0; }
    }
    .bg { fill: #0d1117; }
    .ascii-line {
      font-family: "Courier New", monospace;
      font-size: 11px;
      fill: #00ff41;
      opacity: 0;
      animation: fadeIn 0.1s forwards;
    }
    .scan {
      fill: rgba(0, 255, 65, 0.15);
      animation: scanline 3s ease-in-out infinite;
    }
    .title {
      font-family: "Courier New", monospace;
      font-size: 12px;
      fill: #00ff41;
      opacity: 0.8;
    }
    .border {
      fill: none;
      stroke: #00ff41;
      stroke-width: 1;
      opacity: 0.4;
    }
  </style>
