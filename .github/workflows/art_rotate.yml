name: Rotate ASCII Art

on:
  # Fires when you push a commit to THIS profile repo
  push:
    branches: [main]
    paths-ignore:
      - 'dark_mode.svg'
      - 'light_mode.svg'
      - 'cache/**'
  # Also allows manual trigger from Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate-art:
    runs-on: ubuntu-latest
    steps:
      - name: Validate token secret
        run: |
          if [ -z "${{ secrets.METRICS_ACCESS_TOKEN }}" ]; then
            echo "ERROR: METRICS_ACCESS_TOKEN secret is not set."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.METRICS_ACCESS_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Rotate Art (once per day)
        run: python rotate_art.py

      - name: Commit if art changed
        run: |
          git config --local user.name "GitHub Action"
          git config --local user.email "action@github.com"
          git add README.md runs.json
          git diff --staged --quiet && echo "No rotation today, skipping commit." || (
            git commit -m "chore: rotate ASCII art [$(date +'%Y-%m-%d')]"
            git pull --rebase origin main
            git push
          )
