name: GitHub Metrics Generator

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Validate token secret
        run: |
          if [ -z "${{ secrets.METRICS_ACCESS_TOKEN }}" ]; then
            echo "ERROR: METRICS_ACCESS_TOKEN secret is not set or is empty."
            echo "Go to: Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.METRICS_ACCESS_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install aiohttp lxml loguru python-dateutil

      - name: Generate metrics
        run: python metrics/today.py
        env:
          ACCESS_TOKEN: ${{ secrets.METRICS_ACCESS_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
          LASTFM_TOKEN: ${{ secrets.LASTFM_TOKEN }}
          LASTFM_USER: ${{ secrets.LASTFM_USER }}
          EXCLUDED_REPOS: ${{ secrets.METRICS_EXCLUDED_REPOS }}
          EXCLUDED_LANGUAGES: ""

      - name: Commit and push metrics
        run: |
          git config --local user.name "GitHub Action"
          git config --local user.email "action@github.com"
          git add dark_mode.svg light_mode.svg cache/
          git diff --staged --quiet || (git commit -m "chore: update GitHub metrics [$(date +'%Y-%m-%d')]" && git push)
